name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Zeitzonen-Datenbank (nur für die Zeitzonen-Tests; unter Windows nötig)
        run: python -m pip install tzdata
      - name: Unit- und Ende-zu-Ende-Tests
        run: python -m unittest discover -s tests -t . -v
      - name: Demo-Lauf (Beispielbericht erzeugen)
        run: python -m txreconcile --as-of 2025-04-01 --out reports
      - name: Beispielbericht ist reproduzierbar (identisch zu examples/)
        run: python -m txreconcile --as-of 2025-04-01 --out reports --quiet && diff -r examples reports
        if: matrix.os == 'ubuntu-latest'
      - name: Berichte als Artefakt ablegen
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-report
          path: reports/
